name: athena_native
description: "Athena's native side: the kneejerk decision engine and device facts."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.ehollbach.athena_native
        pluginClass: AthenaNativePlugin
      ios:
        pluginClass: AthenaNativePlugin
